name: Deploy Bovett Infrastructure

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_instal: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Setup SSH Access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.APP_SERVER_SSH_KEY }}
      - name: Add App Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ vars.APP_SERVER_IP }} >> ~/.ssh/known_hosts
      - name: Sync Files to Server
        run: |
          rsync -avz --delete apps/web/build apps/web/package.json ubuntu@${{ vars.APP_SERVER_IP }}:/var/www/bovett/
      - name: Restart PM2
        run: |
          ssh ubuntu@${{ vars.APP_SERVER_IP }} "
          cd /var/www/bovett &&
          pnpm install --prod &&
          MEMCACHED_URL=${{ vars.CACHE_SERVER_IP }}:11211 PORT=3000 NODE_ENV=production pm2 start build/index.js --name 'bovett-app' --update-env || pm2 restart bovett-app
          "
